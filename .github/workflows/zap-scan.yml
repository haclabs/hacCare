name: OWASP ZAP Security Scan

# Weekly: passive BASELINE scan of production (observes only — safe to run unattended).
# Manual (Actions → OWASP ZAP Security Scan → Run workflow): choose baseline or full.
# The FULL scan actively probes the app — do NOT point it at production without notice.
on:
  schedule:
    - cron: '0 9 * * 1'   # Mondays 09:00 UTC
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target URL to scan (e.g. https://staging.haccare.app or https://haccare.app)'
        required: true
        default: 'https://haccare.app'
      scan_type:
        description: 'Scan type'
        required: true
        default: 'baseline'
        type: choice
        options:
          - full      # Full active scan — use for formal security assessments
          - baseline  # Passive crawl only — safe for production, less thorough

# Minimal permissions — read-only code access + ability to open issues for findings
permissions:
  contents: read
  issues: write

jobs:
  zap-scan:
    name: OWASP ZAP ${{ github.event.inputs.scan_type == 'full' && 'Full Active Scan' || 'Baseline Passive Scan' }}
    runs-on: ubuntu-latest
    # Scheduled runs have no inputs: default to a passive scan of production.
    # Inputs are passed through env, never interpolated into shell scripts.
    env:
      TARGET_URL: ${{ github.event.inputs.target_url || 'https://haccare.app' }}
      SCAN_TYPE: ${{ github.event.inputs.scan_type || 'baseline' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github

      # -----------------------------------------------------------------------
      # BASELINE SCAN (passive only — safe to run against production)
      # Checks for missing security headers, information disclosure, etc.
      # -----------------------------------------------------------------------
      - name: ZAP Baseline Scan
        if: env.SCAN_TYPE == 'baseline'
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: ${{ env.TARGET_URL }}
          # Rules file lets you tune false positives over time
          rules_file_name: '.github/zap-rules.tsv'
          # Generate all report formats — HTML is most readable for HECVAT
          cmd_options: '-a -j -r zap-report.html -w zap-report.md -J zap-report.json'
          # Open a GitHub issue summarising findings
          issue_title: 'ZAP Baseline Scan — ${{ env.TARGET_URL }}'
          fail_action: false  # Don't fail the workflow — we want the report regardless

      # -----------------------------------------------------------------------
      # FULL SCAN (active — use for formal assessment reports)
      # Actively probes the app; do NOT run against production without planning.
      # -----------------------------------------------------------------------
      - name: ZAP Full Scan
        if: env.SCAN_TYPE == 'full'
        uses: zaproxy/action-full-scan@3c58388149901b9a03b7718852c5ba889646c27c # v0.13.0
        with:
          target: ${{ env.TARGET_URL }}
          rules_file_name: '.github/zap-rules.tsv'
          cmd_options: '-a -j -r zap-report.html -w zap-report.md -J zap-report.json'
          issue_title: 'ZAP Full Scan — ${{ env.TARGET_URL }}'
          fail_action: false

      # -----------------------------------------------------------------------
      # Upload all report formats as downloadable artifacts
      # Retained for 90 days — download from the Actions run summary page
      # -----------------------------------------------------------------------
      - name: Upload ZAP reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: zap-security-report-${{ github.run_number }}
          path: |
            zap-report.html
            zap-report.md
            zap-report.json
            report_html.html
            report_md.md
            report_json.json
          retention-days: 90

      - name: Report summary
        if: always()
        run: |
          echo "## ZAP Scan Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Target:** ${TARGET_URL}" >> $GITHUB_STEP_SUMMARY
          echo "**Scan type:** ${SCAN_TYPE}" >> $GITHUB_STEP_SUMMARY
          echo "**Run:** #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Reports (HTML, JSON, Markdown) are available as artifacts for 90 days." >> $GITHUB_STEP_SUMMARY
          echo "Download from: Actions → this run → Artifacts section" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "For HECVAT: attach \`zap-report.html\` to your security assessment package." >> $GITHUB_STEP_SUMMARY
