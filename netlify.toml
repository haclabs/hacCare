[build]
  command = "npm install --include=dev && npm run build"
  publish = "dist"

[build.environment]
  NODE_ENV = "production"
  # Float on the major so every build gets the newest 22.x security release automatically
  # (Dependabot does not bump runtime versions). Keep in sync with .nvmrc, which CI reads.
  # package.json engines sets the minimum safe version.
  NODE_VERSION = "22"
  NPM_FLAGS = "--include=dev"

# ============================================================================
# SIMULATION SUBDOMAIN CONFIGURATION
# ============================================================================
# Handles simulation.haccare.app subdomain routing
# All requests to the simulation subdomain serve the main app
# The app handles subdomain detection and routing internally

[[redirects]]
  from = "https://simulation.haccare.app/*"
  to = "/index.html"
  status = 200
  force = false

# Main SPA fallback - must come after specific redirects
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
