[build]
  command = "npm install --include=dev && npm run build"
  publish = "dist"

[build.environment]
  NODE_ENV = "production"
  # Float on the major so every build gets the newest 22.x security release automatically
  # (Dependabot does not bump runtime versions). Keep in sync with .nvmrc, which CI reads.
  # package.json engines sets the minimum safe version.
  NODE_VERSION = "22"
  NPM_FLAGS = "--include=dev"

# ============================================================================
# SIMULATION SUBDOMAIN CONFIGURATION
# ============================================================================
# Handles simulation.haccare.app subdomain routing
# All requests to the simulation subdomain serve the main app
# The app handles subdomain detection and routing internally

[[redirects]]
  from = "https://simulation.haccare.app/*"
  to = "/index.html"
  status = 200
  force = false

# ============================================================================
# ECHO (BEDSIDE TABLET) SUBDOMAIN
# ============================================================================
# echo.haccare.app serves the same app; src/main.tsx sees the echo. host and
# locks the device to the /echo view (simulation list -> wristband scan -> MAR).
# Requires echo.haccare.app as a domain alias on this Netlify site.

[[redirects]]
  from = "https://echo.haccare.app/*"
  to = "/index.html"
  status = 200
  force = false

# ============================================================================
# MAIN SITE ROUTING
# ============================================================================
# There is deliberately NO catch-all "/* -> /index.html" rule. Every client
# route is listed below; anything else gets dist/404.html with a real 404
# status, so crawlers don't index typo URLs as copies of the home page.
#
# Adding a new top-level client route in src/main.tsx? Add it here too, or it
# will 404 on a hard refresh.
#
# Public pages are prerendered to their own files by scripts/prerender.mjs.

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/login"
  to = "/login.html"
  status = 200

[[redirects]]
  from = "/set-password"
  to = "/set-password.html"
  status = 200

# Authenticated app, Echo tablet view, OAuth callback
[[redirects]]
  from = "/app/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/app"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/echo/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/echo"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/auth/*"
  to = "/index.html"
  status = 200

# Legacy top-level paths still referenced in the app (Sidebar, SimulationPortal,
# routerIntegratedTenantService). Kept so this change doesn't alter their
# behaviour; they should move under /app/.
[[redirects]]
  from = "/simulation-portal/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/simulation-portal"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/management/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/management"
  to = "/index.html"
  status = 200
